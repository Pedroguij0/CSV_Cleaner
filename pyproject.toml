[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-csv-cleaner"
version = "0.1.0"
description = "Pipeline profissional de higienização de dados e auditoria de qualidade"
authors = [{ name = "Pedro Guijo" }]
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.6.0",
    "ruff>=0.1.0"
]
